name: Build InteractiveArea JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Calculate Dynamic Version
        id: version
        run: |
          RUN_NUM=${{ github.run_number }}
          PADDED=$(printf "%03d" $RUN_NUM)
          MAJOR=${PADDED:0:1}
          MINOR=${PADDED:1:1}
          PATCH=${PADDED:2:1}
          DYNAMIC_VER="${MAJOR}.${MINOR}.${PATCH}"
          echo "VERSION=$DYNAMIC_VER" >> $GITHUB_OUTPUT
          echo "Calculated version: $DYNAMIC_VER"

      - name: Update Maven Version
        run: mvn versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build with Maven
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveArea-${{ steps.version.outputs.VERSION }}
          path: target/InteractiveArea-${{ steps.version.outputs.VERSION }}.jar
