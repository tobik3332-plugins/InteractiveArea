  # Vytvareni oblasti
  create-started: "&aZahajil jsi vytvareni oblasti &e%area%&a. Nyni nastav &f/iarea area %area% pos1 &aa &fpos2&a, pote napis znovu &f/iarea admin create %area%&a."
  create-missing-pos: "&cMusis nejdrive nastavit oba body (pos1 a pos2) ve stejnem svete!"
