# ========================================================
# Seznam opravneni (Permissions) a jejich vyznam:
# - iarea.admin  : Povoluje prikazy /iarea admin ..., /iarea area ... a /iarea area-visualize ...
# - iarea.tp     : Povoluje prikaz /iarea tp <nazev> pro teleportaci k oblasti
# - iarea.reload : Povoluje prikaz /iarea reload pro znovunacteni nastaveni a oblasti
# ========================================================

settings:
  # Typ partiklu pro vizualizaci oblasti (napr. CLOUD, FLAME, HAPPY_VILLAGER, END_ROD)
  visualize-particle: CLOUD

messages:
